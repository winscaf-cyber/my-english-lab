<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MY ENGLISH LAB</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <h1 class="app-title">MY ENGLISH LAB</h1>
    <p class="app-subtitle">하루 5문장 영어</p>
  </header>

  <main class="app-main">

    <div class="progress-row">
      <span class="progress-label" id="progressLabel">1 / 5</span>
      <span class="today-count" id="todayCount">오늘 완료: 0개</span>
    </div>

    <section class="card" id="sentenceCard">
      <div class="listen-row">
        <button class="btn btn-listen" id="listenBtn" type="button">🔊 듣기</button>
      </div>
      <p class="listen-message" id="listenMessage" hidden></p>

      <p class="sentence-en" id="sentenceEn"></p>

      <div class="meaning-box" id="meaningBox" hidden>
        <p class="sentence-kr" id="sentenceKr"></p>
        <p class="sentence-tip" id="sentenceTip"></p>
      </div>

      <button class="btn btn-reveal" id="revealBtn" type="button">뜻 보기</button>

      <p class="status-line" id="statusLine" hidden></p>
    </section>

    <div class="nav-row">
      <button class="btn btn-nav" id="prevBtn" type="button">← 이전</button>
      <button class="btn btn-nav" id="nextBtn" type="button">다음 →</button>
    </div>

    <section class="eval-section">
      <p class="eval-title">이 문장, 얼마나 아시나요?</p>
      <div class="eval-row">
        <button class="btn btn-eval btn-hard" id="evalUnknown" type="button">모르겠음</button>
        <button class="btn btn-eval btn-mid" id="evalMedium" type="button">조금 어려움</button>
        <button class="btn btn-eval btn-easy" id="evalEasy" type="button">알고 있음</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
